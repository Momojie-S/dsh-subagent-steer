# @momojie-s/dsh-subagent-steer 组合包 patch 层：被 profile bundles 列表引用时应用。
# 行 name 用包名（非 file:// URL），由 Node 模块解析到已安装的包。
# 工具默认名 steer_subagent，与内置 send_message / interrupt_agent 共存不冲突。
- insert:
    - id: subagent-steer
      name: '@momojie-s/dsh-subagent-steer'
      config:
        toolName: steer_subagent   # 模型可见工具名；多实例需互异
